spring.application.name=smarthire
server.port=8081

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/smarthire_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Persistence (Managed strictly via Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Versioned Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
