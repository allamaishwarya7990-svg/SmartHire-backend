spring.application.name=smarthire
server.port=${PORT:8081}

# MySQL Database DataSource
# On Render: set DB_URL, DB_USERNAME, DB_PASSWORD environment variables
# Format: jdbc:mysql://host:port/dbname?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthire_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (important for Render cold starts and Aiven)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Hibernate Persistence (Managed strictly via Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Versioned Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
